# Site settings

repository: saptab/ai-agents-real-world-decision-making

course_name: "CSc 59867-E: Senior Project II - AI Agents for Decision Making in the Real World"
course_description: "This course continues the Senior Project sequence focused on designing, implementing, and evaluating AI agents for real-world decision-making problems. Students build on prior project work to refine the system, improve technical rigor, validate performance, and produce a final research-oriented deliverable. The course emphasizes prototype completion, open-source engineering, reproducibility, evaluation, and communication of results through written and oral presentations."
course_semester: "Fall 2026"

baseurl: "/ai-agents-real-world-decision-making" # the subpath of your site, e.g. /blog/
url: "https://saptab.github.io/" # the base hostname & protocol for your site

schoolname: "City College of New York"
schoolurl: "https://www.ccny.cuny.edu/"
twitter_username: CityCollegeNY

address: |
    Department of Computer Science
    City College of New York
    New York, NY

attendance_note: "Attendance during the first 2-3 weeks is mandatory to satisfy federal financial aid regulations."

project_deliverables: |
    Students must produce a complete and documented project codebase, a validated working prototype, and a final research report with clear evaluation and discussion of results. The project should represent the current semester's final Senior Project II deliverable.

